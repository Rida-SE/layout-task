<!DOCTYPE html>
<html>
<head>
    <title>Layout Task</title>
    <style>        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header, nav, footer {
            background-color: #c9ced3;
            padding: 20px;
            margin: 10px;
        }

        main {
            display: flex;
            margin: 10px;
        }

        aside {
            background-color: #c9ced3;
            width: 20%;
            padding: 40px 0;
            margin: 10px;
        }

        section {
            background-color: #c9ced3;
            width: 60%;
            padding: 40px 0;
            margin: 10px;
        }    </style>
</head>
<body>    <header>
        Header
    </header>

    <nav>
        Navigation Menu
    </nav>

    <main>
        <aside>
            Content
        </aside>

        <section>
            Main Content
        </section>

        <aside>
            Content
        </aside>
    </main>

    <footer>
        Footer
    </footer></body>
</html>
